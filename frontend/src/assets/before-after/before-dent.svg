<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="bodyBefore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7dde5"/>
      <stop offset="60%" stop-color="#c3ccd7"/>
      <stop offset="100%" stop-color="#a6b1c0"/>
    </linearGradient>
    <linearGradient id="glassBefore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c3d0de"/>
      <stop offset="100%" stop-color="#7f8fa3"/>
    </linearGradient>
    <radialGradient id="dentShade" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#6b7688" stop-opacity=".2"/>
      <stop offset="55%" stop-color="#525c6c" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#2f3542" stop-opacity=".2"/>
    </radialGradient>
  </defs>

  <rect width="400" height="220" fill="#eef1f5"/>
  <ellipse cx="200" cy="187" rx="155" ry="9" fill="#c7d0dc"/>

  <!-- body -->
  <path d="M58 150 L84 117 L130 103 L166 76 Q179 66 199 65 L263 65
           Q279 66 291 79 L319 103 L353 115 Q369 120 377 135 L383 150
           L380 163 L56 163 Z"
        fill="url(#bodyBefore)" stroke="#7c8898" stroke-width="2.5"/>

  <!-- roof highlight (muted) -->
  <path d="M160 82 Q173 68 196 67 L259 67 Q275 68 286 79 L304 99 L153 99 Z"
        fill="#e2e7ee" opacity=".55"/>

  <!-- windshield -->
  <path d="M212 69 L259 69 Q269 70 277 78 L294 99 L214 99 Z"
        fill="url(#glassBefore)" stroke="#7c8898" stroke-width="2"/>

  <!-- side window -->
  <path d="M163 80 Q174 69 194 68 L206 68 L206 99 L149 99 Z"
        fill="url(#glassBefore)" stroke="#7c8898" stroke-width="2"/>

  <path d="M209 67 L209 101" stroke="#5c6779" stroke-width="3"/>

  <!-- door line -->
  <path d="M147 101 L146 158 M263 105 L266 160"
        fill="none" stroke="#9aa5b3" stroke-width="1.5" opacity=".7"/>

  <!-- handle -->
  <rect x="228" y="118" width="22" height="4.5" rx="2" fill="#7c8898"/>

  <!-- headlight -->
  <path d="M348 130 Q366 133 377 145 L378 155 L354 152 Q349 141 348 130 Z"
        fill="#e4e9ee" stroke="#7c8898" stroke-width="2"/>

  <!-- wheels -->
  <circle cx="118" cy="158" r="24" fill="#2b3444"/>
  <circle cx="118" cy="158" r="13" fill="#9aa5b3"/>
  <circle cx="316" cy="158" r="24" fill="#2b3444"/>
  <circle cx="316" cy="158" r="13" fill="#9aa5b3"/>

  <!-- === dent === -->
  <ellipse cx="205" cy="128" rx="36" ry="18" fill="url(#dentShade)"/>
  <path d="M172 122 Q205 145 238 121" stroke="#4b5563" stroke-width="3" fill="none" opacity=".7"/>
  <path d="M180 116 Q205 104 230 115" stroke="#f1f5f9" stroke-width="2" fill="none"
        stroke-linecap="round" opacity=".55"/>

  <!-- === scratch === -->
  <path d="M268 130 L332 143" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <path d="M273 136 L324 147" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" opacity=".35"/>

  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">BEFORE</text>
</svg>
