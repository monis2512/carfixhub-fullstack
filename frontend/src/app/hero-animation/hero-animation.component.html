<section class="hero-animation">
  <div class="scene">

    <!-- Workshop floor -->
    <div class="floor"></div>

    <!-- Soft workshop light -->
    <div class="workshop-glow"></div>

    <!-- Tool trolley -->
    <div class="tool-cart">
      <div class="cart-top"></div>
      <div class="cart-body">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="cart-wheel left"></div>
      <div class="cart-wheel right"></div>
    </div>

    <!-- Car -->
    <svg class="car" viewBox="0 0 720 300" aria-label="Car dent repair">

      <defs>
        <linearGradient id="carPaint" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="45%" stop-color="#f8fafc"/>
          <stop offset="75%" stop-color="#dbe4ef"/>
          <stop offset="100%" stop-color="#b8c5d5"/>
        </linearGradient>

        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#dff3ff"/>
          <stop offset="45%" stop-color="#8eb9d8"/>
          <stop offset="100%" stop-color="#31485f"/>
        </linearGradient>

        <linearGradient id="tire" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#374151"/>
          <stop offset="100%" stop-color="#080d16"/>
        </linearGradient>

        <radialGradient id="rim">
          <stop offset="0%" stop-color="#f8fafc"/>
          <stop offset="45%" stop-color="#94a3b8"/>
          <stop offset="100%" stop-color="#334155"/>
        </radialGradient>

        <radialGradient id="dentGradient" cx="35%" cy="25%" r="75%">
  <stop offset="0%" stop-color="#64748b" stop-opacity=".15"/>
  <stop offset="45%" stop-color="#94a3b8" stop-opacity=".38"/>
  <stop offset="75%" stop-color="#475569" stop-opacity=".28"/>
  <stop offset="100%" stop-color="#1e293b" stop-opacity=".08"/>
</radialGradient>

        <filter id="carShadow">
          <feDropShadow
            dx="0"
            dy="12"
            stdDeviation="10"
            flood-opacity=".22"/>
        </filter>
      </defs>

      <!-- Shadow -->
      <ellipse
        cx="365"
        cy="265"
        rx="300"
        ry="18"
        fill="#64748b"
        opacity=".22"/>

      <path

      <path
        d="M73 170 L104 164 L96 193 L67 198 Z"
