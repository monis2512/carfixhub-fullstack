spring.application.name=carfixhub
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.admin.username=${ADMIN_USERNAME:owner}
app.admin.password=${ADMIN_PASSWORD:change-me-now}

server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
