services:
  - type: web
    name: carfixhub
    runtime: docker
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: carfixhub-db
          property: host

      - key: DATABASE_PORT
        value: "5432"

      - key: DATABASE_NAME
        fromDatabase:
          name: carfixhub-db
          property: database

      - key: DATABASE_USERNAME
        fromDatabase:
          name: carfixhub-db
          property: user

      - key: DATABASE_PASSWORD
        fromDatabase:
          name: carfixhub-db
          property: password

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: carfixhub-db
    plan: free
    databaseName: carfixhub
    user: carfixhub
